name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t yojanasetu:test .

      - name: Smoke test the container
        shell: bash
        run: |
          set -e
          docker run -d --name ys -p 8000:8000 yojanasetu:test
          trap 'docker rm -f ys >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8000/health
          docker logs ys

          if docker run --rm yojanasetu:test python -m pip --version; then
            echo "pip is still in the image"
            exit 1
          fi

      # Advisory on pull requests. The blocking scan runs in the deploy job.
      - name: Scan image for vulnerabilities (advisory)
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed yojanasetu:test

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: eb-deploy

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-west-2
      EB_APP: yojanasetu
      EB_ENV: yojanasetu-prod
      AWS_ROLE_ARN: arn:aws:iam::593489477004:role/yojanasetu-github-deploy-role
      DOCKER_IMAGE: shashank971/yojanasetu
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build once. The image that is scanned is the image that is pushed.
      - name: Build image
        run: |
          set -e
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${DOCKER_IMAGE}:${IMAGE_TAG}" .

      - name: Scan image (fails on fixable CRITICAL vulnerabilities)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.0 image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${DOCKER_IMAGE}:${IMAGE_TAG}"

      - name: Push image
        run: docker push "${DOCKER_IMAGE}:${IMAGE_TAG}"

      - name: Create Elastic Beanstalk deployment bundle
        run: |
          set -e
          mkdir -p eb-bundle

          cat > eb-bundle/Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "${DOCKER_IMAGE}:${IMAGE_TAG}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "8000"
              }
            ]
          }
          EOF

          cat eb-bundle/Dockerrun.aws.json
          cd eb-bundle
          zip ../bundle.zip Dockerrun.aws.json

      - name: Upload bundle and deploy to Elastic Beanstalk
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="elasticbeanstalk-${AWS_REGION}-${ACCOUNT_ID}"
          VERSION="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          S3_KEY="${EB_APP}/${VERSION}.zip"

          # Make the version label available to the verify step
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          aws s3 cp bundle.zip "s3://${BUCKET}/${S3_KEY}"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP" \
            --version-label "$VERSION" \
            --source-bundle S3Bucket="$BUCKET",S3Key="$S3_KEY" \
            --process

          aws elasticbeanstalk update-environment \
            --application-name "$EB_APP" \
            --environment-name "$EB_ENV" \
            --version-label "$VERSION"

          aws elasticbeanstalk wait environment-updated \
            --application-name "$EB_APP" \
            --environment-names "$EB_ENV"

      # Fails the job if Beanstalk rolled back or the app is unhealthy.
      - name: Verify deployment
        shell: bash
        run: |
          set -e
          read -r DEPLOYED HEALTH URL < <(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APP" \
            --environment-names "$EB_ENV" \
            --query 'Environments[0].[VersionLabel,Health,CNAME]' \
            --output text)
          echo "version=${DEPLOYED} health=${HEALTH} url=${URL}"

          if [ "$DEPLOYED" != "$VERSION" ]; then
            echo "Environment is running ${DEPLOYED}, expected ${VERSION} (rolled back?)"
            aws elasticbeanstalk describe-events \
              --application-name "$EB_APP" \
              --environment-name "$EB_ENV" \
              --max-items 15 \
              --query 'Events[].[EventDate,Severity,Message]' \
              --output text
            exit 1
          fi

          # Health can lag for a short while after the update completes
          for i in $(seq 1 12); do
            HEALTH=$(aws elasticbeanstalk describe-environments \
              --application-name "$EB_APP" \
              --environment-names "$EB_ENV" \
              --query 'Environments[0].Health' \
              --output text)
            echo "attempt ${i}: health=${HEALTH}"
            [ "$HEALTH" = "Green" ] && break
            sleep 10
          done
          [ "$HEALTH" = "Green" ] || { echo "Health is ${HEALTH}, not Green"; exit 1; }

          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "http://${URL}/health"
          echo
          echo "Deployment verified: ${VERSION}"