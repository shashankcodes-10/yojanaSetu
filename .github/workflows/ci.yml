name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t yojanasetu:test .
      - name: Smoke test the container
        run: |
          docker run -d --name ys -p 8000:8000 yojanasetu:test
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:8000/health
          docker logs ys
          if docker run --rm yojanasetu:test python -m pip --version; then echo "pip is still in the image"; exit 1; fi
      - name: Scan image for vulnerabilities (report only)
        continue-on-error: true
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.0 image --severity HIGH,CRITICAL --ignore-unfixed yojanasetu:test

  # Runs only on pushes to main, and only once the EB_ENV_NAME repository variable exists.
  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && vars.EB_ENV_NAME != ''
    runs-on: ubuntu-latest
    concurrency: eb-deploy
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EB_APP: ${{ vars.EB_APP_NAME }}
      EB_ENV: ${{ vars.EB_ENV_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build source bundle
        run: zip -r bundle.zip Dockerfile requirements.txt app data .ebextensions
      - name: Upload and deploy to Elastic Beanstalk
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="elasticbeanstalk-${AWS_REGION}-${ACCOUNT}"
          VERSION="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          aws s3 cp bundle.zip "s3://${BUCKET}/${EB_APP}/${VERSION}.zip"
          aws elasticbeanstalk create-application-version --application-name "$EB_APP" \
            --version-label "$VERSION" --source-bundle S3Bucket="$BUCKET",S3Key="${EB_APP}/${VERSION}.zip"
          aws elasticbeanstalk update-environment --environment-name "$EB_ENV" --version-label "$VERSION"
          aws elasticbeanstalk wait environment-updated --application-name "$EB_APP" --environment-name "$EB_ENV"
